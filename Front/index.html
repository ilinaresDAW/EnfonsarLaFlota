<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <h1 class="titulo">Enfosar la flota</h1>
    </header>

    <hr>
    <div class="pagina">
        <div id="bloc1" class="bloc1">
            <h2>Configuracion del Juego</h2>
            <div class="medidas">
                <div class="filas">
                    <label for="filas">Amplada 7-20</label></br><input type="number" id="filas" min="7" max="20"><br>
                </div>
                <div class="columnas">
                    <label for="columnas">Alçada 7-20 </label><br><input type="number" id="columnas" min="7"
                        max="20"><br>
                </div>
            </div>
            <label for="nombre">Nombre de usuario </label><input type="text" id="nombre"><br>
            <button id="datos">Enviar datos</button>
            <!--<input type="button" value="Genera una tabla" onclick="genera_tabla()" />-->
            <div class="difcultad" id="dificultad">Dificultad</div>
            <button id="reiniciar">Reiniciar</button>
            <button id="abandonar"> Abandonar</button>



        </div>
        <div id="bloc2" class="bloc2">
            <div class="tablero">
                <h1>Tablero</h1>
                <table>
                    <tbody id="tabla">

                    </tbody>
                </table>
            </div>
            <div class="botonDisparo">
                <button id="disparar">Disparar</button>
            </div>

        </div>
        <div id="bloc3" class="bloc3">
            <p class="jugador" id="jugador">Jugador: </p>
            <p class="disparos" id="disparos">Disparos: 0</p>
            <p class="disparosFallados" id="disparosFallados">Disparos fallados: 0</p>
            <p class="barcosHundidos" id="barcosHundidos">Barcos Hundidos: 0</p>
            <p class="puntosPartida" id="puntos">Puntos: 0</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
