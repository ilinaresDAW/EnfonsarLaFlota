<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hundir la flota</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <h1 class="titulo2">Battle grid</h1>
        <h1 class="titulo">Battle Grid</h1>
    </header>

    <hr>
    <div class="pagina">
        <div id="bloc1" class="bloc1">
            <div class="menuConf">
                <h2>Configuracion del Juego</h2>
                <div class="medidas">
                    <div class="filas">
                        <label for="filas">Amplada 7-20</label><br><input type="number" id="filas" min="7" max="20"><br>
                    </div>
                    <div class="columnas">
                        <label for="columnas">Alçada 7-20 </label><br><input type="number" id="columnas" min="7"
                            max="20"><br>
                    </div>

                </div>
                <div class="num-barcos">
                    <label for="numBarcos">Número de barcos (1-10)</label><br>
                    <input type="range" id="numBarcos" min="1" max="10">
                </div>
                <div class="dificultad">
                    <label>Dificultad</label><br>
                    <label><input class =""type="radio" name="dificultad" value="facil" > Fácil</label><br>
                    <label><input type="radio" name="dificultad" value="media"> Media</label><br>
                    <label><input type="radio" name="dificultad" value="dificil"> Difícil</label>
                </div>
                <label for="nombre">Nombre de usuario </label><input type="text" id="nombre"><br>
                <button id="datos">Enviar datos</button>
                <div class="difcultad" id="dificultad">Dificultad</div>
                <button id="reiniciar">Reiniciar</button>
                <button id="abandonar">Abandonar</button>

            </div>
            <div class="imagenMando">
                <img src="img/gameOn.jpg" alt="imgaenjuego">
            </div>
        </div>

        <div id="bloc2" class="bloc2">
            <div class="tablero">
                <h1>Tablero</h1>
                <table>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <div class="botonDisparo">
                <button id="disparar">Disparar</button>
            </div>
        </div>
        <div id="bloc3" class="bloc3">
            <div class="marcador">

                <div>
                    <h2>Marcador</h2>
                    <p id="puntosGanados"></p>
                    <p id="puntos" class="puntos">1000 Punts</p>

                </div>
                <div>
                    <h1 id="final"></h1>
                </div>
            </div>
            <div class="estats">
                <h2>Estadisticas</h2>
                <p class="jugador" id="jugador">Jugador: </p>
                <div class="estats2">
                    <h2>Estats del Jugador</h2>
                    <div class="disparos">
                        <p class="disparosAcertados" id="disparos">Disparos Acertados: 0</p>
                        <p class="disparosFallados" id="disparosFallados">Disparos fallados: 0</p>
                    </div>
                    <p class="barcosHundidos" id="barcosHundidos">Barcos Hundidos: 0</p>
                    <div class="jugadas">
                        <h2>Numero de jugadas</h2>
                        <p id="totalDisparos">0</p>
                    </div>
                </div>
            </div>
            <hr>
            <div id="ultimaJugada">
                <p>Últim missatge: </p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
